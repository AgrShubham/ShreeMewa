name: CI Pipeline

on:
  push:
    branches: [main, experiment/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Vite Production Bundle Build
        run: npm run build
